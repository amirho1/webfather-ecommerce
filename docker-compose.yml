services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/app/data/webfather-ecommerce.db
      REDIS_URL: redis://redis:6379
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:?Set PAYLOAD_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
      MELIPAYAMAK_CREDENTIAL: ${MELIPAYAMAK_CREDENTIAL:-}
      MELIPAYAMAK_FROM: ${MELIPAYAMAK_FROM:-}
      MELIPAYAMAK_JWT: ${MELIPAYAMAK_JWT:-}
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/public/media
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - proxy
      - backend
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

volumes:
  sqlite_data:
    name: ${SQLITE_VOLUME_NAME:-webfather_sqlite_data}
  media_data:
    name: ${MEDIA_VOLUME_NAME:-webfather_media_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-webfather_redis_data}

networks:
  backend:
    internal: true
  proxy:
    name: ${DOCKER_PROXY_NETWORK:-dokploy-network}
    external: ${DOCKER_PROXY_NETWORK_EXTERNAL:-true}
